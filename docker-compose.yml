services:
  # ============================================================
  # 1. Frontend Service (React + Vite + Tailwind CSS)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oralscan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - oralscan-network
    restart: unless-stopped

  # ============================================================
  # 2. Backend API Gateway Service (FastAPI)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oralscan-backend
    ports:
      - "8000:8000"
    environment:
      - AI_ENGINE_URL=http://ai-engine:8001
      - DATABASE_URL=postgresql+asyncpg://postgres:secretpassword@postgres:5432/oralscan
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
    depends_on:
      - ai-engine
      - postgres
    networks:
      - oralscan-network
    restart: unless-stopped

  # ============================================================
  # 3. PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:15
    container_name: oralscan-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=oralscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oralscan-network
    restart: unless-stopped

  # ============================================================
  # 3. AI Inference Engine Service (PyTorch + YOLO + Transformers)
  # ============================================================
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: oralscan-ai-engine
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - FUSION_ALPHA=0.6
    volumes:
      - ./ai-engine:/app
    networks:
      - oralscan-network
    restart: unless-stopped

# ============================================================
# Shared Microservices Network & Volumes
# ============================================================
networks:
  oralscan-network:
    driver: bridge

volumes:
  postgres_data:
