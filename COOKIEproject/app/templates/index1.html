<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
</head>

<body>
    <h1>Oral diseases</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".jpg, .jpeg, .png">
        <br><br>
        <input type="checkbox" id="v7" name="yolo_version" value="v7">
        <label for="v7">YOLOv7</label><br>
        <input type="checkbox" id="v8" name="yolo_version" value="v8">
        <label for="v8">YOLOv8</label><br>
        <br>
        <input type="submit" value="Submit">
    </form>
    <div class="weight-some">
        <form id="scoreForm">
            <label for="drinkAlcohol">Drink alcohol score:</label>
            <select id="drinkAlcohol" name="drinkAlcohol">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="smoking">Smoking score:</label>
            <select id="smoking" name="smoking">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="chewBetelNut">Chew betel nut score:</label>
            <select id="chewBetelNut" name="chewBetelNut">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="eatSpicyFood">Eat spicy food score:</label>
            <select id="eatSpicyFood" name="eatSpicyFood">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="wipeOff">Can be wiped off score:</label>
            <select id="wipeOff" name="wipeOff">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="noSymptoms">No symptoms score:</label>
            <select id="noSymptoms" name="noSymptoms">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <label for="alwaysHurts">It always hurts score:</label>
            <select id="alwaysHurts" name="alwaysHurts">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>
    <div>
        <p>{{ label }}</p>
    </div>
    <div>
        <img src="{{ image_output }}" alt="Processed Image">
    </div>
</body>

</html>
