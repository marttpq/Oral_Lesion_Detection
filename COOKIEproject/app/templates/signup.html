<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for ('static', filename='image/production.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Detect Lesion Sign up</title>
    <script>
        function togglePassword() {
            var passwordField = document.getElementById('password');
            var toggleBtn = document.getElementById('togglePassword');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleBtn.innerHTML = 'Hide Password';
            } else {
                passwordField.type = 'password';
                toggleBtn.innerHTML = 'Show Password';
            }
        }
    </script>
</head>
<body>
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">
        <div class="registration-form">
        <form action="/signup" method="POST">
            <img src="{{ url_for('static', filename='image/img2.png') }}" 
                alt="Detect Lesion Logo" 
                class="img-fluid responsive-image mx-auto d-block"
                style="max-height: 150px; max-width: 100%;">
            <h3 class="text-center mb-4">Sign up</h3>
            <div class="form-group">
                <!-- Display error message for email if it exists -->
                {% if email_error %}
                    <small class="text-danger">{{ email_error }}</small>
                {% endif %}
                <input type="text" name="email" class="form-control item" id="email" placeholder="Email" value="{{ email }}">
            </div>
            <div class="form-group">
                <!-- Display error message for password if it exists -->
                {% if password_error %}
                    <small class="text-danger">{{ password_error }}</small>
                {% endif %}
                <input type="password" name="password" class="form-control item" id="password" placeholder="Password">
                
                
            </div>
            <div class="form-group text-center">
                <button type="submit" class="btn btn-lg btn-outline-primary w-100">Sign up</button>
            </div>
            <br>
            <div class="form-group text-center">
                <p>Already have an account? <a href="/">Sign in</a></p>
            </div>
        </form>

        <div class="social-media">
            <h5>Sign up with social media</h5>
            <div class="form-group text-center mt-3">
                <a href="/login" class="google-login">
                    <img src="{{ url_for('static', filename='image/google.jpg') }}" alt="Google Logo">
                    Sign in with Google
                </a>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
