<!DOCTYPE html>
<html>

<head>
    <title>Image Upload and Processing</title>
</head>
<style>
    .form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .button {
        background-color: rgb(50, 199, 248);
        width: 150px;
        height: 30px;
        border-radius: 15px;
        border: 0;
        font-size: 18px;
        cursor: pointer;
        transition-duration: 0.5s;
    }

    .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    #img {
        width: 80%;
        height: auto;
        padding: 20px;
    }
</style>

<body>
    <div class="container">
        <div class="form">
            <h1>Upload Image for Lesion Detection</h1>
            <form method="post" enctype="multipart/form-data" action="/uploaded">
                <label for="file">Select Image:</label>
                <input type="file" id="file" name="file">
                <br>
                <br>
                <label for="model_version">Select Model Version:</label>
                <select id="model_version" name="model_version">
                    <option value="v7">YOLOv7</option>
                    <option value="v8">YOLOv8</option>
                </select>
                <br>
                <br>
                <button class="button" type="submit" value="Upload and Process">submit</button>
            </form>
        </div>
        <div class="form" id = "img">
            {% if image_output %}
            <p>Detected Lesion: {{ label }}</p>
            <img src="{{ image_output }}" alt="Processed Image" width="100%" height="100%">
            {% endif %}
        </div>
    </div>

</body>
</html>
