<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for ('static', filename='image/production.png') }}">
    <title>Contact Us</title>
    <!-- Add Animation Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        /* Reset default margins and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
            overflow-x: hidden; /* Prevent horizontal scroll during animations */
            background: linear-gradient(45deg, #8eeaff, #5691ff, #8eeaff);
            background-size: 200% 200%; /* Add this line */
            animation: gradientAnimation 10s ease infinite;
        }
        
        
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Header */
        .header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,123,255,0.7) 0%, rgba(0,123,255,0.9) 100%);
            z-index: -1;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Contact section */
        .contact-section {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 3rem;
        }

        /* QR Code Section */
        .qr-section {
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 2rem;
            transition: transform 0.5s ease;
        }

        .qr-section:hover {
            transform: translateY(-5px);
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background-color: #f1f1f1;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .qr-code:hover {
            transform: scale(1.05);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .qr-text {
            margin-top: 15px;
            color: #555;
            font-weight: bold;
        }

        /* Map */
        .map-container {
            width: 100%;
            height: 450px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 2rem 0;
            transition: transform 0.5s ease;
        }

        .map-container:hover {
            transform: translateY(-5px);
        }

        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Button to return home */
        .button-container {
            text-align: center;
            margin: 2rem 0;
        }

        .home-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .home-button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .home-button:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .home-button:hover:before {
            left: 100%;
        }

        /* Footer */
        .footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            position: relative;
            overflow: hidden;
        }

        .footer:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #007bff, #00c6ff, #007bff);
            animation: gradientFlow 3s linear infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .footer p {
            margin-bottom: 1rem;
        }

        /* Social Media Icons Animation */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link:hover {
            background-color: #0056b3;
            transform: translateY(-5px) rotate(360deg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Responsive */
        @media screen and (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .contact-section {
                flex-direction: column;
            }
            
            .qr-section {
                width: 100%;
            }
            
            .map-container {
                height: 350px;
            }
        }

        @media screen and (max-width: 480px) {
            .map-container {
                height: 300px;
            }
            
            .qr-code {
                width: 150px;
                height: 150px;
            }
        }
        
        /* Animation classes */
        .fade-in {
            animation: fadeIn 1s ease forwards;
        }
        
        .slide-in-right {
            opacity: 0;
            transform: translateX(50px);
            animation: slideInRight 0.8s ease forwards;
        }
        
        .slide-in-left {
            opacity: 0;
            transform: translateX(-50px);
            animation: slideInLeft 0.8s ease forwards;
        }
        
        .bounce-in {
            animation: bounceIn 1s ease forwards;
        }
        
        /* Animation keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header animate__animated animate__fadeIn">
        <h1 class="animate__animated animate__slideInDown">Contact Us</h1>
        <p class="animate__animated animate__slideInUp">Email : 64070066@kmitl.ac.th & 64070189@kmitl.ac.th</p>
    </header>

    <!-- Main content -->
    <div class="container">
        
        <!-- QR Code Section -->
        <div class="qr-section animate__animated animate__fadeIn animate__delay-1s">
            <h2>Connect with us on Line</h2>
            <div class="qr-container">
                <div class="qr-code animate__animated animate__pulse animate__infinite animate__slower">
                    <!-- Replace with your actual QR code image -->
                    <img src="{{ url_for('static', filename='image/line-qr.jpg') }}" alt="LINE QR Code">
                </div>
                <p class="qr-text">Scan to add us as a friend on Line Or add Line @527fdsls</p>
            </div>
        </div>
        
        <!-- Map -->
        <div class="map-container slide-in-right" style="animation-delay: 0.3s;">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3875.8795247905847!2d100.77191801417396!3d13.729883790355813!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x311d664988a1bedf%3A0xcc678f180e221cd0!2sKing%20Mongkut&#39;s%20Institute%20of%20Technology%20Ladkrabang!5e0!3m2!1sen!2sus!4v1710110778348!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        
        <!-- Social media links -->
        <div class="social-links slide-in-left" style="animation-delay: 0.5s;">
            <a href="#" class="social-link">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-link">
                <i class="fab fa-twitter"></i>
            </a>
            <a href="#" class="social-link">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-link">
                <i class="fab fa-line"></i>
            </a>
        </div>
        
        <!-- Return to homepage button -->
        <div class="button-container bounce-in" style="animation-delay: 0.7s;">
            <a href="/home" class="home-button">Return to Homepage</a>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 Your Company Name. All rights reserved.</p>
        <p><a href="#" style="color: #007bff; text-decoration: none;">Privacy Policy</a> | <a href="#" style="color: #007bff; text-decoration: none;">Terms of Service</a></p>
    </footer>

    <!-- Add Font Awesome for icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    
    <script>
        // Animation on scroll
        document.addEventListener('DOMContentLoaded', function() {
            // Get all elements that should be animated
            const animatedElements = document.querySelectorAll('.slide-in-right, .slide-in-left, .bounce-in');
            
            // Function to check if an element is in viewport
            function isInViewport(element) {
                const rect = element.getBoundingClientRect();
                return (
                    rect.top <= (window.innerHeight || document.documentElement.clientHeight) &&
                    rect.bottom >= 0
                );
            }
            
            // Function to add animation class when element is in viewport
            function checkVisibility() {
                animatedElements.forEach(element => {
                    if (isInViewport(element)) {
                        element.style.opacity = '1';
                        element.style.transform = 'translateX(0)';
                    }
                });
            }
            
            // Initial check
            checkVisibility();
            
            // Check on scroll
            window.addEventListener('scroll', checkVisibility);
        });
    </script>
</body>
</html>
