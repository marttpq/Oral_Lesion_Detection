<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for ('static', filename='image/production.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
</head>
<body>
    <div class="registration-form">
        <form method="POST">
            <div class="text-center">
                <img src="{{ url_for('static', filename='image/img2.png') }}" 
                     alt="Detect Lesion Logo" 
                     class="img-fluid responsive-image mx-auto d-block"
                     style="max-height: 120px;">
            </div>
            
            <h3 class="text-center">Forgot Password</h3>
            
            <div class="form-group mb-3">
                <input type="email" class="form-control item" id="email" name="email" placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group mb-4">
                <button type="submit" class="btn btn-primary d-block w-100">Reset Password</button>
            </div>
            
            <div class="text-center mb-0">
                <p>Remember your password? <a href="/login">Log in here</a></p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mt-3">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} p-2 text-center" style="border-radius:10px; font-size: 0.9em;">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
        </form>
    </div>
</body>
</html>
