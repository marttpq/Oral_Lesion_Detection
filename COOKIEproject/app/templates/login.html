<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for ('static', filename='image/production.png', _external=True) }}">
    <title>Detect Lesion Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/form.css', _external=True) }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid d-flex flex-column justify-content-center align-items-center min-vh-100">
        <!-- Logo Section -->
        
        
        <div class="registration-form">
            <form action="/" method="POST">
            
                <img src="{{ url_for('static', filename='image/img2.png', _external=True) }}" 
                alt="Detect Lesion Logo" 
                class="img-fluid responsive-image mx-auto d-block"
                style="max-height: 150px; max-width: 100%;">
                <h3 class="text-center mb-4">Welcome to Detect Lesion</h3>
                {% if error %}
                    <div class="alert alert-danger text-center mb-3" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="form-group">
                    <input type="text" name="email" class="form-control item" id="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <input type="password" name="password" class="form-control item" id="password" placeholder="Password">
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-lg btn-outline-primary w-100">Sign in</button>
                </div>
                <div class="form-group text-center mt-3">
                    <p>Don't have an account? <a href="/signup">Sign up</a></p>
                    <p>Forgot Password? <a href="/forgot_password">Reset here</a></p>
                </div>
            </form>
            <div class="social-media">
                <h5>Sign in with social media</h5>
                <div class="form-group text-center mt-3">
                    <a href="/login" class="google-login">
                        <img src="{{ url_for('static', filename='image/google.jpg', _external=True) }}" alt="Google Logo">
                        Sign in with Google
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
